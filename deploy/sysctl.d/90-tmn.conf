# Сетевые буферы и очередь под 1 Гбит/с при RTT 55 мс.
# Замер 28.10.2026: tcp_rmem 6.3 MiB давал ~900 Мбит/с без запаса.
# Файл 90-* применяется после 5x-/9x- из /usr/lib/sysctl.d — наши значения
# выигрывают, поэтому ниже в install.sh есть предупреждение о чужих файлах.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# fq + bbr: очередь под шейпер, CC устойчив к 2 % потерь (NFR-6).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Соединения: много коротких TLS-сессий, не терять их в син-очереди.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0

# PMTU: не залипать на 1500 при инкапсуляции.
net.ipv4.tcp_mtu_probing = 1

# Файловые дескрипторы на весь хост (systemd-лимит юнита — отдельно).
fs.file-max = 1048576
