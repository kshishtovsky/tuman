<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Заметки на воде</title>
<style>
  :root { --ink:#1d2321; --muted:#6b7671; --bg:#f7f6f2; --line:#dcd9d0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.65 Georgia, "Times New Roman", serif; }
  .wrap { max-width:44rem; margin:0 auto; padding:4rem 1.25rem; }
  h1 { font-size:1.9rem; font-weight:normal; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0 0 1.5rem; }
  a { color:#2f6b57; }
  hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
  code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.9em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>404 — такой страницы нет</h1>
  <p>Возможно, адрес набран с ошибкой или материал переехал. Начните с <a href="/">главной</a>.</p>
  <hr>
  <p>Заметки на воде — небольшой блокнот о походах, погоде и книгах. Пишите:
     <a href="mailto:notes@example.org">notes@example.org</a></p>
</div>
</body>
</html>
