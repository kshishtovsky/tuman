# Правила split-tunnel: РФ-сайты мимо туннеля, остальное — в туннель.
#
# Совпадение по суффиксу домена: "example.ru" ловит и "a.example.ru",
# но не "notexample.ru". Форма "*.example.ru" — то же самое.
# CIDR проверяется только для IP-литералов: домены не резолвим (утечка DNS).
# Что не совпало ни с одним правилом — tunnel.
# IDN-домены приходят от SOCKS5 в punycode, поэтому .рф = xn--p1ai.

# Госуслуги, налоги, госсайты
[[rule]]
action = "direct"
domains = [
  "gosuslugi.ru", "nalog.gov.ru", "nalog.ru", "cbr.ru", "pravo.gov.ru",
  "kremlin.ru", "government.ru", "mid.ru", "mvd.ru", "mchs.gov.ru",
  "rospotrebnadzor.ru", "gibdd.ru", "fssp.gov.ru", "sudrf.ru", "courts.gov.ru",
  "pfr.gov.ru", "sfri.ru", "rosreestr.gov.ru", "fas.gov.ru", "customs.gov.ru",
  "rkn.gov.ru", "digital.gov.ru", "edu.gov.ru", "minzdrav.gov.ru",
  "mintrud.gov.ru", "minfin.gov.ru", "culture.gov.ru", "sport.gov.ru",
  "mos.ru", "mosreg.ru", "zakupki.gov.ru", "rostrud.gov.ru", "xn--p1ai",
]

